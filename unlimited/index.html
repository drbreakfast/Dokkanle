<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../head.js?v=<%= new Date().getTime() %>"></script>
    <meta name="description" content="Play as much as you want in Unlimited Mode!">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QJYHLYVWEW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-QJYHLYVWEW');
</script>

<div class="background-container">
    <div class="scrolling-background" id="scrollingBackground"></div>
</div>

<nav class="top-nav" id="top-nav">
    <a href=".." id="nav-home">Home</a>
    <a href="../daily/" id="nav-daily">Daily</a>
    <a href="../unlimited/" id="nav-unlimited">Unlimited</a>
    <a href="../info/" id="nav-info">Info</a>
</nav>

<div id="gameContent" style="padding-bottom:20px;">
    <body>
        <h1 class="outlined-text">Dokkanle!</h1>
        <div class="game-container">
            <button onclick="revealMore()" class="game-play-button">Reveal More</button>
            <button onclick="giveUp()"class="game-play-button">Give Up</button>
            <p id="feedback"></p>
            <p id="streak-feedback"></p>
            <button onclick="nextCard()"style="display:none;">Next</button>
            <div id="image-container" class="image-container"  style="display:none;">
                <img id="background-image"  class="background-image" alt="Card Background"  style="display:none;">
                <img id="card-image"  class="card-image" alt="Card Icon"  style="display:none;">
                <img id="card-rarity"  class="card-rarity" alt="Card Rarity"  style="display:none;">
                <img id="card-type"  class="card-type" alt="Card Type"  style="display:none;">
            </div>
            <div class="passive-box">
                <h2 style="margin-bottom: 0px; margin-top: 5px;">Passive</h2>
                <hr style="border-color: silver; background-color: silver; width: 100%; height: 0.1px;">
                <p id="clue">Loading...</p>
            </div>
            <div class="info-boxes">
                <div class="info-box" style="display: flex; flex-direction: column; align-items: center;">
                    <h3 style="margin-bottom: 0px; margin-top: 5px;">Rarity</h3>
                    <hr style="border-color: silver; background-color: silver; width: 100%; height: 0.1px;">
                    <p id="rarity-temp" style="display: block;">???</p>
                    <img id="rarity-image" alt="Rarity" style="display:none;  user-select: none; pointer-events: none;" width="auto" height=100>
                </div>
                <div class="info-box" style="display: flex; flex-direction: column; align-items: center;">
                    <h3 style="margin-bottom: 0px; margin-top: 5px;">Type</h3>
                    <hr style="border-color: silver; background-color: silver; width: 100%; height: 0.1px;">
                    <p id="type-temp" style="display: block;">???</p>
                    <img id="type-image" alt="Type" style="display:none; user-select: none; pointer-events: none;" width="auto" height=100>
                </div>
            </div>
            <div class="leader-skill-box">
                <h3 style="margin-bottom: 0px; margin-top: 5px;">Leader Skill</h3>
                <hr style="border-color: silver; background-color: silver; width: 100%; height: 0.1px;">
                <p id="leader-info">???</p>
            </div>
            <input type="text" id="guess" placeholder="Enter character name" autocomplete="off">
            <div id="suggestions" class="suggestions-container" style="display:none;"></div>
            <button onclick="submitGuess()">Submit Guess</button>
        </div>
        <div id="streak" class="streak" style="display:none;">Unlimited Streak: </div>
    </body>
</div>
<script src="../script.js?v=<%= new Date().getTime() %>"></script>
</html>
